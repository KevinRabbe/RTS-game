name: RTS Deterministic Test Gate

on:
  push:
  pull_request:

jobs:
  test:
    name: Build and run deterministic suite
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore tests\RtsGame.Tests.csproj

      - name: Build tests
        run: dotnet build tests\RtsGame.Tests.csproj --no-restore

      - name: Run deterministic test suite
        run: dotnet run --project tests\RtsGame.Tests.csproj --no-build
